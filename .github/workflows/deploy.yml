name: Build and deploy Godot game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          VER=4.5.1
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${VER}-stable_linux.x86_64"
          sudo mv "Godot_v${VER}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VER}-stable/Godot_v${VER}-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${VER}.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VER}.stable/"

      - name: Import and export the game
        run: |
          mkdir -p web
          godot --headless --editor --path . --quit
          godot --headless --path . --export-release Web web/index.html
          touch web/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
